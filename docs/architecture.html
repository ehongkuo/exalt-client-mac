<title>Exalt Client Mac Architecture</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;600&family=IBM+Plex+Sans:wght@400;600&display=swap">
<style>
/* Layout: one swimlane per boundary (app, shared file, guard, game code, server); every edge is vertical. */
:root {
  --bg: #f4f6f5; --panel: #ffffff; --fg: #1b2124; --muted: #5a6568; --edge: #3b4547; --rule: #cdd4d1;
  --ours: #1f8a78; --ours-fill: #e2f2ee; --ours-lane: #f2f9f7;
  --deca: #b7791f; --deca-fill: #f8eedc; --deca-lane: #fdf8ef;
  --file: #4f63b8; --file-fill: #e6e9f7; --file-lane: #f4f5fc;
  --sans: "IBM Plex Sans", -apple-system, "Helvetica Neue", Arial, sans-serif;
  --mono: "IBM Plex Mono", ui-monospace, Menlo, monospace;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #131719; --panel: #1a1f21; --fg: #e4e9e7; --muted: #9aa5a3; --edge: #b5c0bd; --rule: #333b3d;
  --ours: #4cc2ac; --ours-fill: #173430; --ours-lane: #162422;
  --deca: #e0a54d; --deca-fill: #3a2d17; --deca-lane: #221d15;
  --file: #8b9cf0; --file-fill: #232a4a; --file-lane: #1a1e2e; color-scheme: dark } }
:root[data-theme="dark"] {
  --bg: #131719; --panel: #1a1f21; --fg: #e4e9e7; --muted: #9aa5a3; --edge: #b5c0bd; --rule: #333b3d;
  --ours: #4cc2ac; --ours-fill: #173430; --ours-lane: #162422;
  --deca: #e0a54d; --deca-fill: #3a2d17; --deca-lane: #221d15;
  --file: #8b9cf0; --file-fill: #232a4a; --file-lane: #1a1e2e; color-scheme: dark }
body { background: var(--bg); color: var(--fg); font-family: var(--sans); }
main { max-width: 1200px; margin: 0 auto; padding-inline: 16px; padding-block: 32px 48px; display: grid; gap: 16px; }
h1 { font-size: 22px; font-weight: 600; margin: 0; text-wrap: balance; }
.lede { margin: 0; color: var(--muted); max-width: 70ch; line-height: 1.5; }
figure { margin: 0; background: var(--panel); border: 1px solid var(--rule); border-radius: 10px; padding: 20px; overflow-x: auto; }
figure svg { display: block; width: 100%; min-width: 860px; height: auto; }
figcaption { margin-top: 14px; color: var(--muted); font-size: 13px; line-height: 1.55; max-width: 95ch; }
code { font-family: var(--mono); font-size: 0.95em; }

/* SVG parts */

.lane-file { fill: var(--file-lane); stroke: var(--file); stroke-width: 1; }
.lane-deca { fill: var(--deca-lane); stroke: var(--deca); stroke-width: 1; }
.proc { fill: none; stroke: var(--deca); stroke-width: 1.5; stroke-dasharray: 7 5; }
.n-ours { fill: var(--ours-fill); stroke: var(--ours); stroke-width: 1.3; }
.n-file { fill: var(--file-fill); stroke: var(--file); stroke-width: 1.3; }
.n-deca { fill: var(--deca-fill); stroke: var(--deca); stroke-width: 1.3; }
.t { fill: var(--fg); font-family: var(--sans); font-size: 14.5px; font-weight: 600; }
.tm { fill: var(--fg); font-family: var(--mono); font-size: 14px; font-weight: 600; }
.s { fill: var(--muted); font-family: var(--sans); font-size: 12.5px; }
.sm { fill: var(--muted); font-family: var(--mono); font-size: 12px; }
.h { fill: var(--fg); font-family: var(--sans); font-size: 14px; font-weight: 600; }
.hm { fill: var(--fg); font-family: var(--mono); font-size: 13.5px; font-weight: 600; }

<main>
  <h1>Exalt Client Mac architecture</h1>
  <p class="lede">How the app, the guard running inside the game, and DECA's server fit together. Each band is a separate boundary, and every arrow crosses exactly one.</p>

        <text class="s" x="0" y="26">Arrows point the way data or a call moves. The guard starts every exchange; the game never sees it.</text>

    </svg>
    <figcaption>The app (Apple silicon) and the guard (Intel, inside the game under Rosetta) never call each other. They share one memory-mapped file, and each block of it has a single writer. Potions and Join call the same game functions as the keys and the ctrl-click menu. Nexus on death is different: while you're in Nexus it redirects eight game functions, including hit reports, damage and HP updates, through the guard. If the predicted HP reaches zero, it requests Nexus before the hit is reported. Arrows point the way data or a call moves. The guard starts every exchange with the game. The game never calls the guard and doesn't know it's there; even the redirected calls are the game calling its own functions. The app won't start the game if the game build hash doesn't match.</figcaption>
